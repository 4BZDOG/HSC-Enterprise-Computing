name: Site checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Syllabus text and order, outcome codes, links, ids, markup, navigation and footer,
      # quizzes, glossary data and diagram figures. Unfinished <!-- CONTENT: --> placeholders
      # are reported but do not fail the run; switch to --strict for the release check.
      - name: Site checks
        run: python3 scripts/check-site.py

      - name: Syllabus alignment
        run: bash scripts/validate-alignment.sh
